version: "3.9"

services:
  # ─── PostgreSQL Database ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: tourist_safety_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tourist_safety
      POSTGRES_USER: tourist
      POSTGRES_PASSWORD: tourist_safe_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourist -d tourist_safety"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis (for WebSocket pub-sub + rate limiting) ───────
  redis:
    image: redis:7-alpine
    container_name: tourist_safety_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
